name: Deploy web

# Deploys ONLY when commits are pushed to the deploy/web branch (or run manually).
# Never on ordinary pushes. Requires repo secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. Rollback: npx wrangler rollback --name express-cleaning-consult-web
on:
  push:
    branches: ['deploy/web']
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:tracking
      - run: npm run build
      - run: npm run build:vinext
      - name: Deploy to Cloudflare Workers
        run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test live site
        run: |
          sleep 15
          code=$(curl -s -o /tmp/home.html -w '%{http_code}' https://www.expresscleaningconsult.com/)
          echo "HTTP $code"; test "$code" = "200"
          grep -q 'Clean spaces' /tmp/home.html
