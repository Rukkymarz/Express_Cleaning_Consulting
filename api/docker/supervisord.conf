[program:api-web]
command=/usr/local/bin/apache2-foreground
priority=10
autorestart=true
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:api-queue]
command=php artisan queue:work database --queue=quote-notifications --sleep=2 --tries=3 --backoff=30 --timeout=45 --max-time=3600
directory=/var/www/html
user=www-data
priority=20
autorestart=true
stopwaitsecs=55
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:quote-notification-recovery]
command=/usr/local/bin/ecc-quote-notification-recovery
directory=/var/www/html
user=www-data
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
