ell us within 24 hours and we'll come back and make it right.<\/p><\/div><\/header><main class=\"ecc-wrap ecc-public-page\"><article class=\"ecc-policy\"><span class=\"ecc-eyebrow\">YOUR INFORMATION<\/span><h1>Privacy Policy<\/h1><p>Effective October 16, 2026.<\/p><h2>Information you share<\/h2><p>We collect the contact, property, scheduling and service details you send when requesting a quote, a discount, vendor setup, a referral or a cleaner partnership. Sign-in and admin features also use account and security information. Do not send payment card details through these forms.<\/p><h2>How we use it<\/h2><p>We use these details to respond, review scope and local availability, coordinate work, support your account, prevent misuse and maintain request records. With your permission, we may email occasional offers. Requesting the first-clean offer asks us to send that specific offer; it does not require consent to ongoing marketing.<\/p><h2>Sharing and service providers<\/h2><p>We share relevant job details with a local partner when needed to review or deliver your requested service, and use hosting, database, email and payment providers to operate the business. Access is limited by role. We do not post customer addresses or contact details publicly.<\/p><h2>Cookies and optional tracking<\/h2><p>Essential cookies support security, sign-in and site functions. Your cookie preferences can be stored for 180 days. If configured and you choose Analytics, Google Analytics and HubSpot may measure site activity. If configured and you choose Advertising, Meta Pixel may measure page views and successful quote requests. We do not send your form name, email, phone or street address as event parameters. Select Cookie settings to change your choices; refusing tracking does not prevent a quote.<\/p><h2>Email choices and privacy requests<\/h2><p>You can unsubscribe from marketing or ask to access, correct or delete information by emailing <a href=\"mailto:support@expresscleaningconsult.com\">support@expresscleaningconsult.com<\/a>. We retain information as needed for service, account, dispute, security and legal obligations, and review requests against those needs. Service messages about an active request are separate from marketing.<\/p><h2>Other people\u2019s details<\/h2><p>Submit a referral only after the client agrees to be contacted about the requested service. Please do not submit sensitive personal information.<\/p><h2>Contact and updates<\/h2><p>Contact support@expresscleaningconsult.com or call (281) 972-7712. We may update this policy and will show the effective date here.<\/p><\/article><\/main><footer class=\"ecc-footer\"><div class=\"ecc-wrap\"><div class=\"ecc-footer-bottom\"><a href=\"/\">Express Cleaning Consult<\/a><a href=\"tel:+12819727712\">(281) 972-7712<\/a><a href=\"mailto:support@expresscleaningconsult.com\">support@expresscleaningconsult.com<\/a><a href=\"/privacy\">Privacy<\/a><a href=\"/terms\">Terms<\/a><\/div><\/div><\/footer><\/div><!--$--><!--/$--><button type=\"button\" class=\"ecc-cookie-settings\">Cookie settings<\/button><script>\n document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();alert('Preview only \u2014 no information was sent. The deployed form saves a backend record.');}));\n const dialog=document.querySelector('.ecc-offer-dialog');const tab=document.querySelector('.ecc-offer-tab');if(tab&&dialog){tab.onclick=()=>dialog.showModal();dialog.querySelectorAll('.ecc-dialog-close,.ecc-skip-offer').forEach(b=>b.onclick=()=>dialog.close());}\n document.querySelectorAll('.ecc-quote-choices button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.ecc-quote-choices button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});\n document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{const href=a.getAttribute('href');if(href&&href.startsWith('/')&&!href.startsWith('//')){e.preventDefault();parent.postMessage({type:'ecc-review-page',path:href. h local partner cleaners. Coverage, crew suitability, equipment, access and timing must be confirmed for each job. Nationwide requests do not mean every ZIP code has an available partner. We do not claim that every partner is insured, background checked or otherwise credentialed unless that information has been verified for your booking.<\/p><h2>24-hour make-it-right guarantee<\/h2><p>Not happy with your clean? Tell us within 24 hours and we'll come back and make it right.<\/p><p>Contact us within 24 hours of completion at support@expresscleaningconsult.com or (281) 972-7712 with the job details and the areas of concern. We will arrange a return visit for an issue within the agreed cleaning scope. Access and timing are coordinated with you. This guarantee does not add services that were excluded from your approved quote.<\/p><h2>First-clean offer<\/h2><p>10% off your first completed cleaning, up to $30. New customers only. One offer per customer/property; cannot be combined. Excludes hauling/disposal fees, taxes, tips, and add-ons. Subject to local availability. Mention FIRSTCLEAN10 before approving your quote; our team confirms the discount in writing.<\/p><h2>Payments and changes<\/h2><p>Any deposit, payment schedule, applicable taxes, cancellation or rescheduling terms, and exclusions must be disclosed with the written quote or booking terms before you accept. The public quote form itself takes no payment.<\/p><h2>Access and safe working conditions<\/h2><p>Provide accurate property details and disclose access restrictions, fragile surfaces, hazards and any special requirements before approving the quote. We may need to adjust the scope or decline work that cannot be performed safely.<\/p><h2>Partner and referral inquiries<\/h2><p>Partner applications and vendor forms are inquiries. Separate approved terms govern any partnership or vendor engagement. Referrals require the client\u2019s permission; no referral payment is promised unless separately agreed in writing
